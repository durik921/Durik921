plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup('software.bernie.geckolib')
        }
    }
}

def sableCompileConfiguration = configurations.create('sableCompileApi') {
    canBeConsumed = false
    canBeResolved = true
}

sourceSets.main.resources.srcDir('src/generated/resources')

neoForge {
    version = neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly files('../let_it_walk-0.1.4.txt')
    compileOnly 'maven.modrinth:sable:2.0.6+mc1.21.1'
    add('sableCompileApi', 'maven.modrinth:sable:2.0.6+mc1.21.1')
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
}

def sableCompanionJar = layout.buildDirectory.file('sable-compile/sable-companion-common.jar')
tasks.register('extractSableCompanion', Copy) {
    from({
        zipTree(sableCompileConfiguration.singleFile).matching {
            include 'META-INF/jarjar/sable-companion-common-*.jar'
        }
    })
    into(layout.buildDirectory.dir('sable-compile'))
    eachFile { details ->
        details.path = 'sable-companion-common.jar'
    }
    includeEmptyDirs = false
    doLast {
        if (!sableCompanionJar.get().asFile.isFile()) {
            throw new GradleException('Sable companion API was not found inside the Sable jar')
        }
    }
}

sourceSets.main.compileClasspath += files(sableCompanionJar)
tasks.named('compileJava').configure {
    dependsOn(tasks.named('extractSableCompanion'))
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
